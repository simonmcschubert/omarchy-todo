name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Unit tests
        run: node --test

      - name: Plugin manifest (Omarchy's own validator, v4.5.0)
        run: |
          curl -fsSL -o /tmp/omarchy-plugin-validate \
            https://raw.githubusercontent.com/basecamp/omarchy/ac2690cd7be4f47e4a255f5e2e78d904d436b068/bin/omarchy-plugin-validate
          bash /tmp/omarchy-plugin-validate .

      - name: Shell scripts
        run: shellcheck setup update dev/act dev/desktop dev/demo-tasks dev/systemd-cat
